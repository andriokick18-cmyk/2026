# CI do H2BApply (repo "2026"). `npm test` = `npm run check` (sintaxe de
# todos os arquivos + check-duplicates.js) + smoke-test.js completo
# (~30s, 260+ checks reais — servidor real + fixtures). O comentário
# antigo aqui dizia que o smoke-test.js "precisa ser reescrito do zero"
# e por isso só rodava o check — já não é verdade (a suíte foi
# atualizada pra esta reconstrução e passa 100%); rodando ela de verdade
# a partir de agora, senão um push quebrado passava batido.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
